- id: passwords-length-and-uniqueness
  title: Length and uniqueness beat complexity
  body: >-
    Use a long passphrase (16+ characters) that is unique to every account.
    Reusing a password means one breached service exposes all the others; a
    password manager makes unique passwords practical.
  source: AMANAK security baseline
  last_reviewed: "2026-10-01"
  tags: [passwords, password-manager]

- id: passwords-never-share
  title: Never share passwords or one-time codes
  body: >-
    No legitimate support agent, bank, or government body will ask for your
    password or a one-time code. Anyone who does is attempting account
    takeover, regardless of how official the request looks.
  source: AMANAK security baseline
  last_reviewed: "2026-10-01"
  tags: [passwords, credentials, social-engineering]

- id: passwords-breach-response
  title: If a password may be exposed, rotate it now
  body: >-
    If you reused a password on a service that reported a breach, change it on
    every account that shared it, then enable two-factor authentication. Check
    for unexpected forwarding rules and sessions afterwards.
  source: AMANAK security baseline
  last_reviewed: "2026-10-01"
  tags: [passwords, breach, response]
