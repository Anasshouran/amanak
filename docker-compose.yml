services:
  db:
    image: postgres:15-alpine
    container_name: amanak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: amanak
      POSTGRES_USER: amanak
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amanak -d amanak"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amanak-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: amanak-backend
    restart: unless-stopped
    command: >
      bash -c "python backend/manage.py migrate
               && python backend/manage.py collectstatic --no-input
               && celery -A config worker --loglevel=info"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      PYTHONPATH: /srv/amanak/backend:/srv/amanak/security-engine
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pg_data: