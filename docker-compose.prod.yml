# AMANAK production stack (P6).
#
# Usage:
#   cp .env.production.example .env.production   # then fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d
#
# Hardening:
#   * db and redis never publish host ports; they are reachable only on the
#     internal `amanak` network.
#   * backend publishes no host port either; nginx is the sole ingress.
#   * backend runs as UID 10001 (never root).
#   * no `privileged`, no `network_mode: host`, no `cap_add`.
#
# Secrets come exclusively from `.env.production` (gitignored). The file is
# optional for `docker compose config` so the file can be validated before
# secrets exist.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amanak}
      POSTGRES_USER: ${POSTGRES_USER:-amanak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amanak} -d ${POSTGRES_DB:-amanak}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amanak

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amanak

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    user: "10001"
    env_file:
      - path: .env.production
        required: false
    environment:
      APP_ENV: production
      DEBUG: "False"
    command:
      - sh
      - -c
      - |
        python backend/manage.py migrate --no-input &&
        python backend/manage.py collectstatic --no-input &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    volumes:
      - staticfiles:/srv/amanak/backend/staticfiles
      - media:/srv/amanak/backend/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz/').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - amanak

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/amanak.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/var/www/static:ro
      - media:/var/www/media:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - backend
    networks:
      - amanak

networks:
  amanak:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:
  certbot_www:
  certbot_conf:
