# LOCAL PRODUCTION-STYLE TESTING ONLY
#
# This override is for running the production-shaped stack on a local
# machine without TLS or a real domain.
#
# It is NOT for deployment. Production uses docker-compose.prod.yml alone,
# with real TLS termination by nginx and a real domain.
#
# Usage:
#   docker compose -p amanak-local \
#     -f docker-compose.prod.yml -f docker-compose.local-prod.yml up -d
#
# Tear down:
#   docker compose -p amanak-local \
#     -f docker-compose.prod.yml -f docker-compose.local-prod.yml down

services:
  nginx:
    volumes:
      - ./infrastructure/nginx/amanak.local.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/var/www/static:ro
      - media:/var/www/media:ro

  backend:
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173,http://localhost:8080,http://localhost:8081
      # E2E testing only: the Playwright suite performs far more auth calls
      # (register/login/refresh) per minute than a real user, which trips the
      # production `auth` throttle of 20/min and yields spurious 429s. The rate
      # is only overridable in debug mode (see config/settings.py), so both are
      # set here to mirror the CI E2E job (.github/workflows/ci.yml).
      DJANGO_DEBUG: "true"
      # Local dev runs over HTTP, so cookies must not be Secure.
      APP_ENV: "local"
      AUTH_THROTTLE_RATE: "1000/min"
      SCAN_USER_THROTTLE_RATE: "1000/min"
      SCAN_IP_THROTTLE_RATE: "3000/min"
      SCAN_GLOBAL_THROTTLE_RATE: "10000/min"
      # P17.7b: settings edits / preference flips / export requests from the
      # single E2E account would otherwise trip the production defaults.
      ME_UPDATE_THROTTLE_RATE: "1000/min"
      NOTIF_PREFS_THROTTLE_RATE: "1000/min"
      ME_EXPORT_THROTTLE_RATE: "1000/hour"
