# Overrides for running the prod stack locally (no TLS, HTTP only).
#
# Use with a distinct project name so it never collides with the dev stack
# (docker-compose.yml), which shares the default project name "amanak":
#   docker compose -p amanak-local \
#     -f docker-compose.prod.yml -f docker-compose.local-prod.yml up -d
#
# Requires infrastructure/nginx/amanak.local.conf (HTTP only, port 80).

services:
  nginx:
    volumes:
      - ./infrastructure/nginx/amanak.local.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/var/www/static:ro
      - media:/var/www/media:ro

  backend:
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost
