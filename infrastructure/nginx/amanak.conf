# AMANAK — nginx reverse proxy / TLS terminator (P6).
#
# Mounted read-only by docker-compose.prod.yml at
# /etc/nginx/conf.d/default.conf.
#
# Replace `your-domain.example` with the real domain (also set DOMAIN in
# .env.production) before deploying. Certificates are issued by certbot into
# the `certbot_conf` volume (/etc/letsencrypt); see docs/operations/tls-setup.md.

upstream amanak_backend {
    server backend:8000;
    keepalive 16;
}

# --- HTTP: ACME challenge + redirect to HTTPS ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # certbot (webroot) writes challenge files here; never redirect these.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    # Modern TLS only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — keep max-age in sync with SECURE_HSTS_SECONDS in config.settings.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Matches DATA_UPLOAD_MAX_MEMORY_SIZE (10 MB) in config.settings.
    client_max_body_size 10m;

    # Logs to stdout/stderr so they appear in `docker logs`.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    location /healthz/ {
        proxy_pass http://amanak_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location /api/ {
        proxy_pass http://amanak_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location /admin/ {
        proxy_pass http://amanak_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Everything else is not served by this host (the web/mobile clients are
    # hosted separately and talk to /api/).
    location / {
        return 404;
    }
}
