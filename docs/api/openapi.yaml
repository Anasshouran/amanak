openapi: 3.1.0
info:
  title: AMANAK API
  description: |
    Defensive personal cybersecurity companion. User data is strictly
    scoped: every authenticated request only ever touches the calling
    user's own rows.
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8000/api/v1
security:
  - bearerAuth: []

paths:
  /auth/register/:
    post:
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email: { type: string, format: email }
                username: { type: string }
                password: { type: string, format: password, minLength: 8 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: AuthResponse
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/login/:
    post:
      summary: Sign in and receive JWT tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: AuthResponse
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/refresh-token/:
    post:
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access: { type: string }

  /auth/verify-email/:
    post:
      summary: Mark the authenticated user's email as verified
      responses:
        "200":
          description: OK

  /auth/password-reset-request/:
    post:
      summary: "Request a password reset (dev: console email, no account leak)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: OK

  /me/:
    get:
      summary: Current authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: User
    patch:
      summary: Partially update the caller's own profile
      description: |
        Accepts only `display_name` (2–100 characters, trimmed, no control
        characters) and `locale` (`ar` or `en`). Any other field — including
        `email`, `username`, `is_staff` and `is_verified` — is rejected with
        400 rather than silently ignored. Returns the full updated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: User
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Rate limited

  /me/export/:
    post:
      summary: Request a one-time export of the caller's own data
      description: |
        Creates a single-use token that expires after one hour. Download the
        document with `GET /me/export/{token}/`. The export excludes secrets by
        construction (vault ciphertext/IVs, password hashes, refresh tokens,
        TOTP seeds).
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportRequestResponse"

  /me/export/{token}/:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Download a previously requested self-service export
      description: |
        Single-use and strictly user-scoped: a token belonging to another user
        returns 404; a used or expired token returns 410.
      responses:
        "200":
          description: The export document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Unknown token
        "410":
          description: Token already used or expired

  /me/sessions/:
    get:
      summary: List the caller's active sessions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"

  /me/sessions/revoke-all/:
    post:
      summary: Revoke all of the caller's sessions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer }

  /me/activity/:
    get:
      summary: Login history for the caller
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoginEventInfo"

  /me/alerts/:
    get:
      summary: Unread session alerts for the caller
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionAlertInfo"

  /me/alerts/{id}/read/:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Mark a session alert as read
      responses:
        "200":
          description: OK

  /dashboard/:
    get:
      summary: Dashboard overview counts and score
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: DashboardOverview

  /dashboard/security-score/:
    get:
      summary: Get the user's security score
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: SecurityScore
    post:
      summary: Recompute and persist the user's security score
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: SecurityScore

  /accounts/:
    get:
      summary: List the user's accounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
    post:
      summary: Create an account (metadata only; never passwords/MFA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

  /accounts/{id}/:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get one account (404 if not owned by caller)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404":
          description: Not found or not owned
    patch:
      summary: Update one account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404":
          description: Not found or not owned
    delete:
      summary: Delete one account
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found or not owned

  /devices/:
    get:
      summary: List the user's devices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
    post:
      summary: Create a device
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }

  /devices/{id}/:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get one device
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "404": { description: Not found or not owned }
    patch:
      summary: Update one device
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceInput" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "404": { description: Not found or not owned }
    delete:
      summary: Delete one device
      responses:
        "204": { description: Deleted }
        "404": { description: Not found or not owned }

  /incidents/:
    get:
      summary: List the user's incidents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Incident" }
    post:
      summary: Create an incident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }

  /incidents/{id}/:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get one incident
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Incident" } } } }
        "404": { description: Not found or not owned }
    patch:
      summary: Update one incident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentInput" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Incident" } } } }
        "404": { description: Not found or not owned }
    delete:
      summary: Delete one incident
      responses:
        "204": { description: Deleted }
        "404": { description: Not found or not owned }

  /scan/url:
    post:
      summary: Scan a URL (offline rules engine; no network calls)
      description: |
        Input is analyzed locally. Raw input is never stored; only a redacted,
        length-capped preview is persisted. Throttled per user (30/min), per IP
        (60/min), and globally (1000/min); exceeding a limit returns 429.
        Input is capped at 8192 characters; binary input is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Rate limit exceeded

  /scan/message:
    post:
      summary: Scan a message for social-engineering indicators
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Rate limit exceeded

  /scan/history:
    get:
      summary: List the caller's scan history (owner-scoped)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScanResultRecord" }

  /ai/explain-scan:
    post:
      summary: Explain one of the caller's scans (AI; disabled by default)
      description: |
        Requires authentication. Returns 503 `{"code": "ai_disabled"}` unless
        AI_ENABLED is true. The prompt is built from scan metadata only (never
        raw input or scan history) and is redacted before any provider call.
        Per-user limit 10/min and a global daily cap apply; exceeding a limit
        returns 429. A provider failure returns a generic 502.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIExplainScanRequest" }
      responses:
        "200":
          description: Generated explanation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Scan not found or not owned by the caller
        "429":
          description: Rate limit exceeded
        "502":
          description: Provider unavailable (no input content in body)
        "503":
          $ref: "#/components/responses/AIDisabled"

  /ai/guidance:
    post:
      summary: Defensive safety guidance for a topic (AI; disabled by default)
      description: |
        Requires authentication. Returns 503 `{"code": "ai_disabled"}` unless
        AI_ENABLED is true. Guidance is grounded in the curated offline
        knowledge base; prompts are redacted before any provider call. Per-user
        limit 10/min and a global daily cap apply; exceeding a limit returns
        429. A provider failure returns a generic 502.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIGuidanceRequest" }
      responses:
        "200":
          description: Generated guidance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Rate limit exceeded
        "502":
          description: Provider unavailable (no input content in body)
        "503":
          $ref: "#/components/responses/AIDisabled"

  /breach/monitored-emails/:
    get:
      summary: List the caller's monitored emails (breach monitor)
      description: |
        Requires authentication. Returns only the calling user's rows. When
        BREACH_MONITOR_ENABLED is false the list is always empty (200 []), so
        the endpoint never leaks whether monitoring is configured.
      responses:
        "200":
          description: Monitored emails
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MonitoredEmail" }
        "401":
          description: Authentication required
    post:
      summary: Opt an email into breach monitoring
      description: |
        Requires authentication and explicit consent (consent must be true;
        false or missing returns 400 consent_required). The address is stored
        but is only ever handed to a provider while monitoring is enabled.
        When disabled returns 503 breach_monitor_disabled. A per-user maximum
        (default 5) applies (400 max_emails_reached); duplicates return 400
        already_monitored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BreachConsentPayload" }
      responses:
        "201":
          description: Monitored email created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoredEmail" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Authentication required
        "503":
          $ref: "#/components/responses/BreachMonitorDisabled"

  /breach/monitored-emails/{id}/:
    delete:
      summary: Stop monitoring an email (owner-scoped)
      description: |
        Requires authentication. Deletes the monitored email and cascades its
        hits. A row owned by another user returns 404. Returns 503 when
        monitoring is disabled.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "401":
          description: Authentication required
        "404":
          description: Not found
        "503":
          $ref: "#/components/responses/BreachMonitorDisabled"

  /breach/check/:
    post:
      summary: Check monitored emails against the breach provider
      description: |
        Requires authentication. Runs the configured provider against the
        caller's active monitored emails and upserts new hits, de-duplicated by
        (email, breach name). Raw provider responses are never stored, and raw
        addresses are never logged (only sha256(email)[:8]). When disabled
        returns 503 breach_monitor_disabled. Per-user limit 2/min and per-IP
        limit 5/min apply; exceeding a limit returns 429. Provider failure
        returns 502 breach_provider_error.
      responses:
        "200":
          description: Check summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckSummary" }
        "401":
          description: Authentication required
        "429":
          description: Rate limit exceeded
        "502":
          description: Provider unavailable
        "503":
          $ref: "#/components/responses/BreachMonitorDisabled"

  /breach/hits/:
    get:
      summary: List the caller's breach hits
      description: |
        Requires authentication. Returns hits for the caller's monitored emails
        only. Returns 200 [] when monitoring is disabled.
      responses:
        "200":
          description: Breach hits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BreachHit" }
        "401":
          description: Authentication required

  /two-factor/profile/:
    get:
      summary: Get the caller's 2FA vault profile
      description: |
        Requires authentication. A profile holds the KDF parameters (salt,
        iterations, algorithm) needed to derive the vault key client-side; the
        server can never derive it. Returns 404 not_found when the caller has
        not created a vault yet.
      responses:
        "200":
          description: Vault profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorProfile" }
        "401":
          description: Authentication required
        "404":
          description: No vault for this user (code not_found)
    post:
      summary: Create the caller's 2FA vault profile
      description: |
        Requires authentication. The client generates a fresh 32-byte salt and
        sends it base64-encoded. Returns 409 profile_exists when a profile
        already exists. Throttled at 30/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorCreateProfilePayload" }
      responses:
        "201":
          description: Vault profile created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorProfile" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Authentication required
        "409":
          description: A vault already exists (code profile_exists)
    delete:
      summary: Delete the caller's vault and every entry in it
      description: |
        Requires authentication. Cascades all entries. Returns 404 not_found
        when no profile exists.
      responses:
        "204":
          description: Deleted
        "401":
          description: Authentication required
        "404":
          description: No vault for this user (code not_found)

  /two-factor/entries/:
    get:
      summary: List the caller's vault entries
      description: |
        Requires authentication. Returns only the calling user's entries. The
        ciphertext and iv are opaque base64 blobs the server never decrypts.
        Throttled at 240/min per user. Requires a profile (404 not_found
        without one).
      responses:
        "200":
          description: Vault entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TwoFactorEntry" }
        "401":
          description: Authentication required
        "404":
          description: No vault for this user (code not_found)
    post:
      summary: Add an encrypted entry to the caller's vault
      description: |
        Requires authentication. The body carries the plaintext label/issuer and
        the base64 ciphertext/iv. On creation, clients that bind the entry's id
        as AES-GCM additional authenticated data must PATCH the ciphertext with
        the real id afterwards. Throttled at 120/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorCreateEntryPayload" }
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorEntry" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Authentication required
        "404":
          description: No vault for this user (code not_found)

  /two-factor/entries/{id}/:
    patch:
      summary: Update an entry (owner-scoped)
      description: |
        Requires authentication. Partially updates label/issuer/ciphertext/iv.
        A row owned by another user returns 404. Throttled at 120/min per user.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorUpdateEntryPayload" }
      responses:
        "200":
          description: Entry updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorEntry" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Authentication required
        "404":
          description: Not found
    delete:
      summary: Delete an entry (owner-scoped)
      description: |
        Requires authentication. A row owned by another user returns 404.
        Throttled at 120/min per user.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "401":
          description: Authentication required
        "404":
          description: Not found

  /password-vault/profile/:
    get:
      summary: Get the caller's password vault profile
      description: |
        Requires authentication. A profile holds the KDF parameters (salt,
        iterations, algorithm) needed to derive the vault key client-side; the
        server can never derive it. Returns 404 not_found when the caller has
        not created a vault yet. Throttled at 60/min per user.
      responses:
        "200":
          description: Vault profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordVaultProfile" }
        "401":
          description: Authentication required
        "404":
          description: No vault for this user (code not_found)
    post:
      summary: Create the caller's password vault profile
      description: |
        Requires authentication. The client generates a fresh 32-byte salt and
        sends it base64-encoded. Returns 409 profile_exists when a profile
        already exists. Throttled at 30/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordCreateProfilePayload" }
      responses:
        "201":
          description: Vault profile created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordVaultProfile" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Authentication required
        "409":
          description: A vault already exists (code profile_exists)
    delete:
      summary: Delete the caller's vault and every password in it
      description: |
        Requires authentication. Cascades all entries. The caller must confirm
        with their AMANAK **account** password (not the vault master password,
        which the server never sees). A missing or wrong confirmation returns
        400 invalid_password; no profile returns 404 not_found. Throttled at
        30/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordDeleteProfilePayload" }
      responses:
        "204":
          description: Deleted
        "400":
          description: Missing or incorrect account password (code invalid_password)
        "401":
          description: Authentication required
        "404":
          description: No vault for this user (code not_found)

  /password-vault/entries/:
    get:
      summary: List the caller's password entries
      description: |
        Requires authentication. Returns metadata (title, username, url,
        category, tags) in plaintext plus an opaque base64 ciphertext/iv the
        server can never read. Results are ordered by title. Throttled at
        60/min per user.
      responses:
        "200":
          description: Password entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PasswordEntry" }
        "401":
          description: Authentication required
    post:
      summary: Create a password entry
      description: |
        Requires authentication. Plaintext metadata plus a base64 AES-256-GCM
        blob. Because the client binds the entry's id as AAD, it should PATCH a
        fresh ciphertext+iv with the real id after creation. Throttled at
        60/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordCreateEntryPayload" }
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordEntry" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Authentication required
        "409":
          description: No vault profile yet (code profile_required)

  /password-vault/entries/{id}/:
    patch:
      summary: Update an entry (owner-scoped)
      description: |
        Requires authentication. Partially updates metadata and/or the encrypted
        blob. A row owned by another user returns 404. Throttled at 60/min per
        user.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordUpdateEntryPayload" }
      responses:
        "200":
          description: Entry updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordEntry" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Authentication required
        "404":
          description: Not found
    delete:
      summary: Delete an entry (owner-scoped)
      description: |
        Requires authentication. A row owned by another user returns 404.
        Throttled at 60/min per user.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "401":
          description: Authentication required
        "404":
          description: Not found

  /notifications/preferences/:
    get:
      summary: Read the caller's notification preferences
      description: |
        Returns the five notification toggles, creating the row with defaults
        on first read.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
    patch:
      summary: Update one or more notification toggles
      description: |
        Partial update; only the five known toggles are accepted, and unknown
        keys are rejected with 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              details: { type: object, additionalProperties: true }

    AIDisabled:
      description: AI is disabled by configuration
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, enum: [ai_disabled] }

    BreachMonitorDisabled:
      description: Breach monitoring is disabled by configuration
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, enum: [breach_monitor_disabled] }

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        username: { type: string }
        display_name: { type: string }
        locale: { type: string, enum: [ar, en] }
        is_verified: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpdateMeInput:
      type: object
      properties:
        display_name: { type: string, minLength: 2, maxLength: 100 }
        locale: { type: string, enum: [ar, en] }

    NotificationPreferences:
      type: object
      properties:
        security_alerts: { type: boolean }
        breach_alerts: { type: boolean }
        scan_results: { type: boolean }
        family_activity: { type: boolean }
        product_updates: { type: boolean }

    ExportRequestResponse:
      type: object
      properties:
        token: { type: string }
        download_url: { type: string }
        expires_at: { type: string, format: date-time }

    SessionInfo:
      type: object
      properties:
        jti: { type: string }
        created_at: { type: string, format: date-time }
        last_used: { type: string, format: date-time }
        device: { type: string }
        current: { type: boolean }

    LoginEventInfo:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        ip: { type: string, nullable: true }
        device: { type: string }
        success: { type: boolean }
        suspicious: { type: boolean }
        reasons: { type: array, items: { type: string } }

    SessionAlertInfo:
      type: object
      properties:
        id: { type: integer }
        reasons: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        event:
          type: object
          properties:
            timestamp: { type: string, format: date-time }
            ip: { type: string, nullable: true }
            device: { type: string }

    AuthTokens:
      type: object
      properties:
        access: { type: string }
        refresh: { type: string }

    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        tokens: { $ref: "#/components/schemas/AuthTokens" }

    SecurityScore:
      type: object
      properties:
        id: { type: integer }
        score: { type: integer, minimum: 0, maximum: 100 }
        computed_at: { type: string, format: date-time }
        last_scanned: { type: [string, "null"], format: date-time }

    DashboardOverview:
      type: object
      properties:
        accounts: { type: integer }
        devices: { type: integer }
        open_incidents: { type: integer }
        security_score: { type: integer }

    Account:
      type: object
      properties:
        id: { type: integer }
        service_name: { type: string }
        username: { type: string }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AccountInput:
      type: object
      required: [service_name]
      properties:
        service_name: { type: string }
        username: { type: string }
        notes: { type: string }

    Device:
      type: object
      properties:
        id: { type: integer }
        device_name: { type: string }
        device_type: { type: string }
        platform: { type: string }
        last_reported: { type: [string, "null"], format: date-time }
        notes: { type: string }

    DeviceInput:
      type: object
      required: [device_name]
      properties:
        device_name: { type: string }
        device_type: { type: string }
        platform: { type: string }
        notes: { type: string }

    Incident:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        incident_type: { type: string }
        reported_at: { type: string, format: date-time }
        resolved: { type: boolean }

    IncidentInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        incident_type: { type: string }

    ScanRequest:
      type: object
      required: [input]
      properties:
        input: { type: string, maxLength: 8192 }
        context: { type: [object, "null"], additionalProperties: true }

    ScanMatch:
      type: object
      properties:
        rule_id: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        description: { type: string }
        evidence_redacted: { type: string }

    ScanResponse:
      type: object
      properties:
        verdict: { type: string, enum: [safe, suspicious, dangerous] }
        score: { type: integer, minimum: 0, maximum: 100 }
        matches:
          type: array
          items: { $ref: "#/components/schemas/ScanMatch" }
        ruleset_version: { type: string }
        scanned_at: { type: string, format: date-time }

    ScanResultRecord:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [url, message] }
        verdict: { type: string, enum: [safe, suspicious, dangerous] }
        score: { type: integer }
        matches:
          type: array
          items: { $ref: "#/components/schemas/ScanMatch" }
        ruleset_version: { type: string }
        preview: { type: string }
        created_at: { type: string, format: date-time }

    AIExplainScanRequest:
      type: object
      required: [scan_id]
      properties:
        scan_id: { type: string, description: "Scan identifier (integer primary key, sent as a string)" }
        locale: { type: string, enum: [ar, en], default: ar }

    AIGuidanceRequest:
      type: object
      required: [topic]
      properties:
        topic: { type: string, enum: [phishing, passwords, 2fa, general] }

    AIResponse:
      type: object
      properties:
        text: { type: string }
        provider: { type: string, enum: [null, fake, openai, anthropic] }
        model: { type: string }
        tokens_used: { type: integer }

    MonitoredEmail:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        label: { type: string }
        is_active: { type: boolean }
        consent_given_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BreachHit:
      type: object
      properties:
        id: { type: integer }
        monitored_email: { type: integer }
        email: { type: string, format: email, description: "Owning monitored email address" }
        name: { type: string }
        domain: { type: string }
        breach_date: { type: string, format: date }
        pwn_count: { type: [integer, "null"] }
        data_classes:
          type: array
          items: { type: string }
        is_verified: { type: boolean }
        first_seen_at: { type: string, format: date-time }
        last_checked_at: { type: string, format: date-time }

    CheckSummary:
      type: object
      properties:
        checked: { type: integer }
        hits_new: { type: integer }
        hits_total: { type: integer }

    BreachConsentPayload:
      type: object
      required: [email, consent]
      properties:
        email: { type: string, format: email }
        label: { type: string, maxLength: 100 }
        consent: { type: boolean, description: "Must be true; false or missing returns 400 consent_required" }
    TwoFactorProfile:
      type: object
      description: "KDF parameters for the caller's server-blind 2FA vault."
      properties:
        id: { type: integer }
        kdf_salt: { type: string, description: "Base64-encoded 32-byte salt (server never derives the key)" }
        kdf_iterations: { type: integer, description: "PBKDF2 iteration count fixed by the server" }
        kdf_algorithm: { type: string, description: "KDF/hash identifier, e.g. PBKDF2-HMAC-SHA256" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TwoFactorCreateProfilePayload:
      type: object
      required: [kdf_salt]
      properties:
        kdf_salt: { type: string, description: "Base64-encoded 32-byte salt" }

    TwoFactorEntry:
      type: object
      description: "One encrypted TOTP secret. ciphertext/iv are opaque to the server."
      properties:
        id: { type: integer }
        label: { type: string }
        issuer: { type: string }
        ciphertext: { type: string, description: "Base64 AES-256-GCM ciphertext including the 16-byte tag" }
        iv: { type: string, description: "Base64 12-byte GCM nonce (unique per write)" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TwoFactorCreateEntryPayload:
      type: object
      required: [label, ciphertext, iv]
      properties:
        label: { type: string }
        issuer: { type: string }
        ciphertext: { type: string, description: "Base64 AES-256-GCM ciphertext + tag" }
        iv: { type: string, description: "Base64 12-byte GCM nonce" }

    TwoFactorUpdateEntryPayload:
      type: object
      description: "Any subset of entry fields. Send a fresh ciphertext+iv when re-encrypting."
      properties:
        label: { type: string }
        issuer: { type: string }
        ciphertext: { type: string }
        iv: { type: string }

    PasswordVaultProfile:
      type: object
      description: "KDF parameters for the caller's server-blind password vault."
      properties:
        id: { type: integer }
        kdf_salt: { type: string, description: "Base64-encoded 32-byte salt (server never derives the key)" }
        kdf_iterations: { type: integer, description: "PBKDF2 iteration count fixed by the server" }
        kdf_algorithm: { type: string, description: "KDF/hash identifier, e.g. PBKDF2-HMAC-SHA256" }
        verification_ciphertext: { type: string, description: "Base64 AES-256-GCM blob (empty AAD) proving the master password; opaque to the server" }
        verification_iv: { type: string, description: "Base64 12-byte GCM nonce for the verification blob" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PasswordCreateProfilePayload:
      type: object
      required: [kdf_salt, verification_ciphertext, verification_iv]
      properties:
        kdf_salt: { type: string, description: "Base64-encoded 32-byte salt" }
        verification_ciphertext: { type: string, description: "Base64 AES-256-GCM encryption of the fixed plaintext AMANAK-PWD-VAULT-V1 with empty AAD" }
        verification_iv: { type: string, description: "Base64 12-byte GCM nonce" }

    PasswordDeleteProfilePayload:
      type: object
      required: [account_password]
      properties:
        account_password:
          type: string
          description: "The AMANAK account password confirming vault deletion (never the vault master password)"

    PasswordEntry:
      type: object
      description: "One password entry. Metadata is plaintext; ciphertext/iv are opaque to the server."
      properties:
        id: { type: integer }
        title: { type: string }
        username: { type: string }
        url: { type: string }
        category: { type: string, description: "One of the fixed category set, or empty" }
        tags:
          type: array
          items: { type: string }
        ciphertext: { type: string, description: "Base64 AES-256-GCM ciphertext including the 16-byte tag" }
        iv: { type: string, description: "Base64 12-byte GCM nonce (unique per write)" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PasswordCreateEntryPayload:
      type: object
      required: [title, ciphertext, iv]
      properties:
        title: { type: string }
        username: { type: string }
        url: { type: string }
        category: { type: string }
        tags:
          type: array
          items: { type: string }
        ciphertext: { type: string, description: "Base64 AES-256-GCM ciphertext + tag" }
        iv: { type: string, description: "Base64 12-byte GCM nonce" }

    PasswordUpdateEntryPayload:
      type: object
      description: "Any subset of entry fields. Send a fresh ciphertext+iv when re-encrypting."
      properties:
        title: { type: string }
        username: { type: string }
        url: { type: string }
        category: { type: string }
        tags:
          type: array
          items: { type: string }
        ciphertext: { type: string }
        iv: { type: string }
