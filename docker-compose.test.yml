services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amanak_test
      POSTGRES_USER: amanak
      POSTGRES_PASSWORD: testpass
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amanak -d amanak_test"]
      interval: 2s
      retries: 15

  redis-test:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  backend-test:
    image: python:3.11-slim
    working_dir: /app/backend
    volumes:
      - .:/app
    command: sh -c "pip install -q -r requirements.txt && python manage.py migrate --noinput && python manage.py shell -c \"from django.contrib.auth import get_user_model; User=get_user_model(); u,_=User.objects.get_or_create(email='admin@local.dev',defaults={'username':'admin@local.dev','role':'super_admin','is_staff':True,'is_superuser':True}); u.role='super_admin';u.is_staff=True;u.is_superuser=True;u.set_password('AdminTest2026!');u.save(); print('ok')\" && python manage.py runserver 0.0.0.0:8080"
    environment:
      USE_POSTGRES: "true"
      POSTGRES_DB: amanak_test
      POSTGRES_USER: amanak
      POSTGRES_PASSWORD: testpass
      POSTGRES_HOST: db-test
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis-test:6379/0
      DJANGO_SETTINGS_MODULE: config.settings
      AI_ENABLED: "False"
      AI_CLOUD_CONSENT: "False"
      DJANGO_SECRET_KEY: test-secret-key
      DEBUG: "True"
    ports: ["8080:8080"]
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

  frontend-test:
    image: node:20
    working_dir: /app/apps/web
    volumes:
      - .:/app
    command: sh -c "npm ci --prefer-offline --no-audit && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:8080
    ports: ["5173:5173"]
    depends_on:
      - backend-test
