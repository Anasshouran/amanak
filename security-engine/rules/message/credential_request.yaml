# Message credential-request heuristics.

- id: MSG-CRED-001
  severity: critical
  description: "Message asks for passwords, PINs, or one-time codes (credential phishing)."
  component: text_lower
  pattern: "(password|passwords|pin code|one-time code|one time code|otp|2fa code|two-factor code|verification code|bank card number|card number|cvv|cvc|social security|national id|recovery code|login details|security question answer)"
  tags: [credential-phishing, critical]
  rationale: "Legitimate services never request passwords or codes; this is the definitive phishing ask."
  reference: "https://www.ncsc.gov.uk/guidance/suspicious-email-actions"

- id: MSG-CRED-002
  severity: medium
  description: "Text contains a base64 blob, often used to hide malicious content."
  component: text_raw
  pattern: "^[A-Za-z0-9+/]{20,}={0,2}$"
  tags: [obfuscation, base64]
  rationale: "Long base64 strings in a message usually hide an encoded URL or payload."
  reference: null