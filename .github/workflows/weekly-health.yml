name: Weekly Health Check

on:
  schedule:
    - cron: "0 9 * * 1"      # كل اثنين 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read
  # `gh pr list` goes through the GraphQL API, which needs pull-requests: read.
  # Without it the step dies with "Resource not accessible by integration
  # (repository.pullRequests)" and every metric comes out empty.
  pull-requests: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 50 }

      - name: Collect metrics
        id: metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          # Measure the gate that actually matters: the CI workflow on master.
          # Scoped on purpose — an unscoped `gh run list` also counts Dependabot
          # version-update jobs and the health check itself, so unrelated
          # automation noise could drag the verdict below the threshold.
          # Collect each metric independently: a single failing call must not
          # blank out the others (and must not silently produce empty values
          # that later look like a real regression).
          RUNS=$(gh run list -R "$REPO" --workflow CI --branch master --limit 20 --json conclusion,status \
            --jq '[.[] | select(.status=="completed")] | "\(map(select(.conclusion=="success"))|length)/\(length)"' || echo "")
          ISSUES=$(gh issue list -R "$REPO" --state open --json number --jq 'length' || echo "")
          PRS=$(gh pr list -R "$REPO" --state open --json number --jq 'length' || echo "")
          echo "runs=$RUNS"     >> $GITHUB_OUTPUT
          echo "issues=$ISSUES" >> $GITHUB_OUTPUT
          echo "prs=$PRS"       >> $GITHUB_OUTPUT

      - name: Evaluate success rate
        id: evaluate
        run: |
          RUNS="${{ steps.metrics.outputs.runs }}"
          PASSED=$(echo "$RUNS" | cut -d/ -f1)
          TOTAL=$(echo "$RUNS" | cut -d/ -f2)
          if [ -z "$RUNS" ] || [ -z "$PASSED" ] || [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "::error::Could not collect CI metrics (runs='$RUNS') — skipping the health verdict."
            exit 1
          fi
          RATE=$((PASSED * 100 / TOTAL))
          echo "Success rate: $RATE% ($RUNS)"
          echo "rate=$RATE" >> $GITHUB_OUTPUT
          # TODO: raise to 80 after 2026-11-19 (2 weeks from v1.3.1)
          if [ "$RATE" -lt 70 ]; then
            echo "::error::Success rate below 70% — investigate"
            exit 1
          fi

      - name: Open issue on failure
        # Only when the rate verdict actually failed. A metric-collection
        # failure (no `rate` output) must not open an alarm with empty values.
        if: failure() && steps.evaluate.outputs.rate != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(printf "CI success rate below threshold (%s%%). Open issues: %s. PRs: %s\n\nCheck: https://github.com/%s/actions" \
            "${{ steps.evaluate.outputs.rate }}" "${{ steps.metrics.outputs.issues }}" "${{ steps.metrics.outputs.prs }}" "${{ github.repository }}")
          gh issue create -R "${{ github.repository }}" \
            --title "🚨 Weekly health check failed — $(date +%Y-%m-%d)" \
            --label "maintenance" \
            --body "$BODY"
