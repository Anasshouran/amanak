name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend (unit)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: amanak
          POSTGRES_USER: amanak
          POSTGRES_PASSWORD: amanak-ci
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U amanak"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: pip install pyyaml==6.0.1
      - name: Run tests
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5433"
          POSTGRES_DB: amanak
          POSTGRES_USER: amanak
          POSTGRES_PASSWORD: amanak-ci
          REDIS_URL: redis://127.0.0.1:6380/1
          DJANGO_DEBUG: "true"
          USE_POSTGRES: "true"
        run: pytest -q -m "not integration"

  backend-integration:
    name: Backend (integration)
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: amanak
          POSTGRES_USER: amanak
          POSTGRES_PASSWORD: amanak-ci
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U amanak"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: pip install pyyaml==6.0.1
      - name: Run integration tests
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5433"
          POSTGRES_DB: amanak
          POSTGRES_USER: amanak
          POSTGRES_PASSWORD: amanak-ci
          REDIS_URL: redis://127.0.0.1:6380/1
          DJANGO_DEBUG: "true"
          USE_POSTGRES: "true"
          DJANGO_SECRET_KEY: ci-secret-key
        run: pytest -m "integration" --timeout=120 || true
        continue-on-error: true

  frontend-web:
    name: Frontend (web) — typecheck, unit, e2e
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: amanak
          POSTGRES_USER: amanak
          POSTGRES_PASSWORD: amanak-ci
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U amanak"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck --workspace apps/web
      - run: npm test --workspace apps/web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start backend for e2e
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5433"
          POSTGRES_DB: amanak
          POSTGRES_USER: amanak
          POSTGRES_PASSWORD: amanak-ci
          REDIS_URL: redis://127.0.0.1:6380/1
          DJANGO_DEBUG: "true"
          USE_POSTGRES: "true"
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          AUTH_THROTTLE_RATE: "1000/min"
          # The E2E suite scans (and reads scanner history) from a single IP far
          # more often than a real user, exceeding the production 60/min
          # `scan_ip` limit and causing spurious 429s.
          SCAN_USER_THROTTLE_RATE: "1000/min"
          SCAN_IP_THROTTLE_RATE: "3000/min"
          SCAN_GLOBAL_THROTTLE_RATE: "10000/min"
          # P17.7b: the E2E suite edits the profile, flips notification toggles
          # and requests exports repeatedly from one account.
          ME_UPDATE_THROTTLE_RATE: "1000/min"
          NOTIF_PREFS_THROTTLE_RATE: "1000/min"
          ME_EXPORT_THROTTLE_RATE: "1000/hour"
        run: |
          pip install -r backend/requirements.txt pyyaml==6.0.1
          python backend/manage.py migrate
          python backend/manage.py create_staff_roles || true
          python backend/manage.py runserver 0.0.0.0:8080 &
          sleep 5
          curl -fsS http://127.0.0.1:8080/healthz/ || (echo "backend not up"; exit 1)
      - run: npm exec --workspace apps/web playwright install --with-deps chromium
      - run: npm run e2e --workspace apps/web
        env:
          E2E_BACKEND_DIR: ${{ github.workspace }}/backend
          E2E_PYTHON: python3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  frontend-mobile:
    name: Frontend (mobile) — typecheck [temporary]
    runs-on: ubuntu-24.04
    # Temporary until issue #10 is resolved — does not block merge
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck --workspace apps/mobile

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Bring up test stack
        run: docker compose -f docker-compose.test.yml up -d --build
        timeout-minutes: 8

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz/ >/dev/null 2>&1; then
              echo "backend ready"; exit 0
            fi
            sleep 2
          done
          echo "backend failed to start" >&2; exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173/ >/dev/null 2>&1; then
              echo "frontend ready"; exit 0
            fi
            sleep 2
          done
          echo "frontend failed to start" >&2; exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL:  http://localhost:8080
          CI: "true"
        run: npx playwright test --reporter=github,html

      - name: Upload trace + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
