version: 2
updates:
- package-ecosystem: npm
  directory: /apps/web
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: UTC
  open-pull-requests-limit: 5
  groups:
    web-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  labels:
  - dependencies
  - frontend
  commit-message:
    prefix: chore(deps-web)
    include: scope
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
  - dependency-name: decode-uri-component
    versions:
    - '>=0.5.0 <0.6.0'
- package-ecosystem: npm
  directory: /apps/mobile
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: UTC
  open-pull-requests-limit: 5
  groups:
    mobile-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  labels:
  - dependencies
  - frontend
  commit-message:
    prefix: chore(deps-mobile)
    include: scope
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
  - dependency-name: decode-uri-component
    versions:
    - '>=0.5.0 <0.6.0'
- package-ecosystem: pip
  directory: /backend
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: UTC
  open-pull-requests-limit: 5
  groups:
    backend-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  labels:
  - dependencies
  - backend
  commit-message:
    prefix: chore(deps-backend)
    include: scope
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  labels:
  - dependencies
  - ci
  commit-message:
    prefix: chore(deps-actions)
    include: scope
  groups:
    actions-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
